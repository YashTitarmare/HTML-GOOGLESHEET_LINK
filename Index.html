
<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px 15px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1f2937;
    }

    .container {
      max-width: 550px;
      margin: 20px auto;
      background: white;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 5px 22px rgba(0, 0, 0, 0.08);
    }

    h2 {
      text-align: center;
      margin-top: 0;
      color: #1d4ed8;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 16px 0 7px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 15px;
      background: #fff;
    }

    input:focus, textarea:focus {
      outline: 2px solid #93c5fd;
      border-color: #2563eb;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      margin-top: 18px;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .success {
      color: #15803d;
    }

    .error {
      color: #b91c1c;
    }
  </style>
</head>

<body>
  <main class="container">
    <h2>Customer Data Form</h2>
    <p class="subtitle">Enter your details below</p>

    <form id="customerForm">
      <label for="name">Full Name *</label>
      <input id="name" name="name"
             type="text" maxlength="150" required>

      <label for="phone">Phone Number *</label>
      <input id="phone" name="phone"
             type="tel" maxlength="30" required>

      <label for="email">Email Address *</label>
      <input id="email" name="email"
             type="email" maxlength="254" required>

      <label for="address">Address</label>
      <textarea id="address" name="address"
                maxlength="2000"></textarea>

      <label for="message">Message</label>
      <textarea id="message" name="message"
                maxlength="5000"></textarea>

      <button id="submitButton" type="submit">
        Submit Details
      </button>

      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script>
    const form = document.getElementById("customerForm");
    const button = document.getElementById("submitButton");
    const statusBox = document.getElementById("status");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      if (!form.reportValidity()) return;

      button.disabled = true;
      button.textContent = "Saving...";
      statusBox.className = "";
      statusBox.textContent = "Please wait. Saving your data...";

      const data = Object.fromEntries(
        new FormData(form).entries()
      );

      google.script.run
        .withSuccessHandler(function(result) {
          statusBox.className = "success";
          statusBox.textContent = result;
          form.reset();
          button.disabled = false;
          button.textContent = "Submit Details";
        })
        .withFailureHandler(function(error) {
          statusBox.className = "error";
          statusBox.textContent =
            "Unable to save: " +
            (error && error.message
              ? error.message
              : "Please try again.");

          button.disabled = false;
          button.textContent = "Submit Details";
        })
        .submitForm(data);
    });
  </script>
</body>
</html>
